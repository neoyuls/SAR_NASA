# Claves verificadas en Streamlit 1.67 (`streamlit/config.py`).
# [theme.light] y [theme.dark] permiten que Streamlit siga automáticamente
# prefers-color-scheme del sistema operativo, además del selector en la UI.
# No se fija `font`: "sans serif" no es válido. La tipografía está en src/ui/theme.py.

[theme]
baseRadius = "4px"

[theme.light]
primaryColor = "#0B647D"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1220"
borderColor = "#94A3B8"
linkColor = "#0B647D"
codeTextColor = "#0B1220"
codeBackgroundColor = "#E2E8F0"
redColor = "#BE123C"
orangeColor = "#9A3412"
greenColor = "#047857"
blueColor = "#0B647D"
baseRadius = "4px"

[theme.dark]
primaryColor = "#06B6D4"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
borderColor = "#1E293B"
linkColor = "#06B6D4"
codeTextColor = "#F8FAFC"
codeBackgroundColor = "#141F36"
redColor = "#F43F5E"
orangeColor = "#F59E0B"
greenColor = "#10B981"
blueColor = "#06B6D4"
baseRadius = "4px"

# Presentation chrome: keep the cockpit's own header as the only toolbar. The theme
# tokens above still let Streamlit follow prefers-color-scheme (AGENTS.md design rules).
[client]
toolbarMode = "minimal"
